name: WebGL publication diagnostics
on:
  pull_request:
    paths:
      - tools/probe-webgl-publication.py
      - .github/workflows/figma-webgl-probe.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: python -m pip install playwright==1.57.0 Pillow
      - run: python -m playwright install --with-deps webkit
      - name: Compare publication strategies without qualifying failed pixels
        env:
          VB6_BROWSER: webkit
        run: python tools/probe-webgl-publication.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgl-publication-probe
          path: reports/webgl-publication-probe
          if-no-files-found: error
          retention-days: 7
