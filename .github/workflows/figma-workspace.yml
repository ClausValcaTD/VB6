name: Figma workspace
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: figma-workspace-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: node --test tests/figma-*.test.mjs tests/modal-contributions.test.mjs
      - run: python -m pip install playwright==1.57.0 Pillow
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Provide headed Mesa GL for Firefox renderer qualification
        if: matrix.browser == 'firefox'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0
      - name: Resolve Chromium executable
        if: matrix.browser == 'chromium'
        run: |
          python - <<'PYTHON' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_PATH=' + p.chromium.executable_path)
          PYTHON
      - name: Hosted workspace, real origin persistence and application isolation
        env:
          VB6_BROWSER: ${{ matrix.browser }}
          VB6_TEST_TRANSPORT: http
        run: |
          set -o pipefail
          mkdir -p "reports/figma-workspace/${VB6_BROWSER}/http"
          python tools/figma-browser-tests.py 2>&1 | tee "reports/figma-workspace/${VB6_BROWSER}/http/acceptance.log"
          python tools/figma-presentation-browser-tests.py 2>&1 | tee "reports/figma-workspace/${VB6_BROWSER}/http/presentation.log"
          gl_display=()
          if [ "$VB6_BROWSER" = firefox ]; then gl_display=(xvfb-run -a -s '-screen 0 1920x1200x24'); fi
          "${gl_display[@]}" python tools/figma-retained-webgl-browser-tests.py 2>&1 | tee "reports/figma-workspace/${VB6_BROWSER}/http/retained-webgl.log"
          python tools/figma-navigation-browser-tests.py 2>&1 | tee "reports/figma-workspace/${VB6_BROWSER}/http/navigation.log"
          python tools/figma-editor-browser-tests.py 2>&1 | tee "reports/figma-workspace/${VB6_BROWSER}/http/editor-properties.log"
          python tools/figma-property-keyboard-browser-tests.py 2>&1 | tee "reports/figma-workspace/${VB6_BROWSER}/http/keyboard-calculator.log"
      - name: Standalone file workspace and persistence
        env:
          VB6_BROWSER: ${{ matrix.browser }}
          VB6_TEST_TRANSPORT: file
        run: |
          set -o pipefail
          mkdir -p "reports/figma-workspace/${VB6_BROWSER}/file"
          python tools/figma-browser-tests.py 2>&1 | tee "reports/figma-workspace/${VB6_BROWSER}/file/acceptance.log"
          python tools/figma-presentation-browser-tests.py 2>&1 | tee "reports/figma-workspace/${VB6_BROWSER}/file/presentation.log"
          gl_display=()
          if [ "$VB6_BROWSER" = firefox ]; then gl_display=(xvfb-run -a -s '-screen 0 1920x1200x24'); fi
          "${gl_display[@]}" python tools/figma-retained-webgl-browser-tests.py 2>&1 | tee "reports/figma-workspace/${VB6_BROWSER}/file/retained-webgl.log"
          python tools/figma-navigation-browser-tests.py 2>&1 | tee "reports/figma-workspace/${VB6_BROWSER}/file/navigation.log"
          python tools/figma-editor-browser-tests.py 2>&1 | tee "reports/figma-workspace/${VB6_BROWSER}/file/editor-properties.log"
          python tools/figma-property-keyboard-browser-tests.py 2>&1 | tee "reports/figma-workspace/${VB6_BROWSER}/file/keyboard-calculator.log"
      - name: Classic designer auto-layout regression
        env:
          VB6_BROWSER: ${{ matrix.browser }}
          VB6_TEST_TRANSPORT: http
        run: python tools/auto-layout-browser-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: figma-workspace-${{ matrix.browser }}
          path: |
            reports/figma-workspace
            reports/auto-layout
          if-no-files-found: error
          retention-days: 7
  code-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        backend: [webgpu, webgl2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: python -m pip install playwright==1.63.0 Pillow
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: Qualify actual source glyphs on required GPU backend
        env:
          VB6_FIGMA_CODE_GPU: ${{ matrix.backend }}
          VB6_BROWSER: chromium
        run: |
          python - <<'PYTHON' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_PATH=' + p.chromium.executable_path)
          PYTHON
      - name: Hosted and standalone source-code pixel regression
        env:
          VB6_FIGMA_CODE_GPU: ${{ matrix.backend }}
          VB6_BROWSER: chromium
        run: |
          VB6_TEST_TRANSPORT=http python tools/figma-editor-browser-tests.py
          VB6_TEST_TRANSPORT=file python tools/figma-editor-browser-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: figma-code-${{ matrix.backend }}
          path: reports/figma-workspace
          if-no-files-found: error
          retention-days: 7
