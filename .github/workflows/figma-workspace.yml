name: Figma workspace
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: figma-workspace-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: node --test tests/figma-*.test.mjs tests/modal-contributions.test.mjs
      - run: python -m pip install playwright==1.57.0 Pillow
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Resolve Chromium executable
        if: matrix.browser == 'chromium'
        run: |
          python - <<'PYTHON' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_PATH=' + p.chromium.executable_path)
          PYTHON
      - name: Hosted workspace, real origin persistence and application isolation
        env:
          VB6_BROWSER: ${{ matrix.browser }}
          VB6_TEST_TRANSPORT: http
        run: |
          set -o pipefail
          mkdir -p "reports/figma-workspace/${VB6_BROWSER}/http"
          python tools/figma-browser-tests.py 2>&1 | tee "reports/figma-workspace/${VB6_BROWSER}/http/acceptance.log"
          python tools/figma-presentation-browser-tests.py 2>&1 | tee "reports/figma-workspace/${VB6_BROWSER}/http/presentation.log"
      - name: Standalone file workspace and persistence
        env:
          VB6_BROWSER: ${{ matrix.browser }}
          VB6_TEST_TRANSPORT: file
        run: |
          set -o pipefail
          mkdir -p "reports/figma-workspace/${VB6_BROWSER}/file"
          python tools/figma-browser-tests.py 2>&1 | tee "reports/figma-workspace/${VB6_BROWSER}/file/acceptance.log"
          python tools/figma-presentation-browser-tests.py 2>&1 | tee "reports/figma-workspace/${VB6_BROWSER}/file/presentation.log"
      - name: Classic designer auto-layout regression
        env:
          VB6_BROWSER: ${{ matrix.browser }}
          VB6_TEST_TRANSPORT: http
        run: python tools/auto-layout-browser-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: figma-workspace-${{ matrix.browser }}
          path: |
            reports/figma-workspace
            reports/auto-layout
          if-no-files-found: error
          retention-days: 7
