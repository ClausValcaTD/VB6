name: Designer controls
on:
  push:
    branches: [main]
    paths: ['src/**', 'packages/**', 'tools/**', 'tests/**', '.github/workflows/designer.yml']
  pull_request:
    paths: ['src/**', 'packages/**', 'tools/**', 'tests/**', '.github/workflows/designer.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: designer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  designer:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: python -m pip install playwright==1.57.0 Pillow
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: SSTab imports and all built-in control designer interactions
        env:
          VB6_BROWSER: ${{ matrix.browser }}
        run: |
          set -o pipefail
          mkdir -p "reports/designer/${VB6_BROWSER}"
          python tools/browser-designer-tests.py --browser "$VB6_BROWSER" --origin http 2>&1 | tee "reports/designer/${VB6_BROWSER}/browser-tests.log"
      - name: Require reproducible generated artifacts
        run: npm run verify:ide-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: designer-${{ matrix.browser }}
          path: reports/designer
          retention-days: 7
