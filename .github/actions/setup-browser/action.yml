name: Prepare browser validation
description: Strict build and pinned dependencies shared by read-only browser jobs.
inputs:
  browser:
    description: chromium, firefox or webkit
    required: true
  profile:
    description: authoring or rendering, retaining the existing browser versions
    default: authoring
  mesa:
    description: Install explicit software GPU and Xvfb dependencies
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: tools/ci/requirements-*.txt
    - name: Build and install the selected browser
      shell: bash
      env:
        ENGINE: ${{ inputs.browser }}
        PROFILE: ${{ inputs.profile }}
      run: |
        set -euo pipefail
        case "$ENGINE" in chromium|firefox|webkit) ;; *) exit 2 ;; esac
        case "$PROFILE" in authoring|rendering) ;; *) exit 2 ;; esac
        npm run build
        python -m pip install -r "tools/ci/requirements-${PROFILE}.txt"
        python -m playwright install --with-deps "$ENGINE"
        echo "VB6_BROWSER=$ENGINE" >> "$GITHUB_ENV"
    - name: Explicit software graphics dependencies
      if: inputs.mesa == 'true'
      shell: bash
      run: sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth libgl1-mesa-dri libglx-mesa0
    - name: Resolve installed Chromium
      if: inputs.browser == 'chromium'
      shell: bash
      run: |
        python - <<'PY' >> "$GITHUB_ENV"
        from playwright.sync_api import sync_playwright
        with sync_playwright() as p:
            print('CHROMIUM_PATH=' + p.chromium.executable_path)
        PY
